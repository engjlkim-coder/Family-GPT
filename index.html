<style>
:root{

  --navy2:#45647f;
  --bg:#eef2f5;

}

*{

html,body{

}

body{

}

header{

header .brand{

h1{

  margin:0
}

.sub{

.headerbtn{

button,select{

<script>

const converter=new showdown.Converter({
  tables:true,
  strikethrough:true,
  simplifiedAutoLink:true
});

const chat=document.querySelector('#chat');
const q=document.querySelector('#question');

const KEY='familyGPTConversationsV1';
const OLD='familyGPTHistory';

let conversations=[];
let currentId=null;
let images=[];
let fileAttachments=[];
let deferredPrompt=null;


function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


/*
 * Showdown이 MathJax 구분자의 역슬래시를 변경하지 않도록
 * 마크다운 변환 전에 수식을 임시 토큰으로 보호합니다.
 */
function markdownWithMath(text){

  const formulas=[];


  function saveFormula(formula){

    const token=
      'MATHPLACEHOLDER'+
      formulas.length+
      'XYZ';

    formulas.push(formula);

    return token;
  }


  let source=
    String(text||'');


  /*
   * \[ ... \] 블록 수식
   */
  source=source.replace(
    /\\\[[\s\S]*?\\\]/g,
    match=>saveFormula(match)
  );


  /*
   * \( ... \) 인라인 수식
   */
  source=source.replace(
    /\\\([\s\S]*?\\\)/g,
    match=>saveFormula(match)
  );


  /*
   * $$ ... $$ 블록 수식
   */
  source=source.replace(
    /\$\$[\s\S]*?\$\$/g,
    match=>saveFormula(match)
  );


  /*
   * $ ... $ 인라인 수식
   */
  source=source.replace(
    /(^|[^\\$])\$(?!\$)([^\n$]+?)\$/g,
    (match,prefix,formula)=>{
      return prefix+
        saveFormula('$'+formula+'$');
    }
  );


  /* 코드블록은 보호하고, 나머지 원본 HTML 태그는 글자로 표시 */
  const codeBlocks=[];

  source=source.replace(/```[\s\S]*?```|`[^`\n]+`/g,m=>{
    codeBlocks.push(m);
    return 'CODEBLOCKPLACEHOLDER'+(codeBlocks.length-1)+'XYZ';
  });

  source=source.replace(/</g,'&lt;');

  source=source.replace(/CODEBLOCKPLACEHOLDER(\d+)XYZ/g,
    (m,i)=>codeBlocks[Number(i)]);

  let html=
    converter.makeHtml(source);


  formulas.forEach(
    (formula,index)=>{

      const token=
        'MATHPLACEHOLDER'+
        index+
        'XYZ';

      html=
        html
          .split(token)
          .join(esc(formula));

    }
  );


  return html;
}


function uid(){

  return 'c_'+
    Date.now().toString(36)+
    '_'+
    Math.random()
      .toString(36)
      .slice(2,8);

}


function now(){

  return Date.now();

}


function formatDate(ts){

  const d=
    new Date(ts);

  return d.toLocaleDateString(
    'ko-KR',
    {
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }
  )+
  ' '+
  d.toLocaleTimeString(
    'ko-KR',
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


function loadStore(){

  try{

    conversations=
      JSON.parse(
        localStorage.getItem(KEY)||
        '[]'
      );

  }catch{

    conversations=[];

  }


  if(!Array.isArray(conversations)){

    conversations=[];

  }


  if(!conversations.length){

    try{

      const old=
        JSON.parse(
          localStorage.getItem(OLD)||
          '[]'
        );


      if(
        Array.isArray(old)&&
        old.length
      ){

        const t=
          old.find(
            x=>x.role==='user'
          )?.content||
          '이전 대화';


        const c={
          id:uid(),
          title:makeTitle(t),
          createdAt:now(),
          updatedAt:now(),
          model:'gpt-5.6',
          history:old
        };


        conversations=[c];

      }

    }catch{}

  }


  if(!conversations.length){

    createConversation(
      false
    );

  }


  currentId=
    conversations[0]?.id||
    null;

}


function saveStore(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(
        conversations
      )
    );

  }catch(e){

    console.error(
      '대화 저장 오류:',
      e
    );

  }

}


function current(){

  return conversations.find(
    c=>c.id===currentId
  );

}


function makeTitle(text){

  const s=
    String(text||'')
      .replace(/\s+/g,' ')
      .trim();


  if(!s){

    return '새 대화';

  }


  return s.length>28
    ?s.slice(0,28)+'…'
    :s;

}


function createConversation(open=true){

  const c={

    id:uid(),

    title:'새 대화',

    createdAt:now(),

    updatedAt:now(),

    model:
      document.querySelector(
        '#model'
      ).value,

    history:[]

  };


  conversations.unshift(c);

  currentId=c.id;

  images=[];

  fileAttachments=[];

  renderFiles();

  saveStore();

  renderConversations();

  updateTitle();

  draw();


  if(open){

    closeDrawer();

  }

}


function updateTitle(){

  const c=current();

  document.querySelector(
    '#currentTitle'
  ).textContent=
    c?.title||
    '새 대화';

}


function renderConversations(){

  const list=
    document.querySelector(
      '#conversationList'
    );


  list.innerHTML='';


  conversations
    .sort(
      (a,b)=>
        (b.updatedAt||0)-
        (a.updatedAt||0)
    )
    .forEach(c=>{

      const row=
        document.createElement(
          'div'
        );

      row.className=
        'conv'+
        (c.id===currentId
          ?' active'
          :'');


      const main=
        document.createElement(
          'div'
        );

      main.className=
        'convMain';


      main.innerHTML=`

        <div class="convTitle">
          ${esc(c.title||'새 대화')}
        </div>

        <div class="convDate">
          ${formatDate(c.updatedAt||c.createdAt)}
        </div>

      `;


      const actions=
        document.createElement(
          'div'
        );

      actions.className=
        'convActions';


      const del=
        document.createElement(
          'button'
        );

      del.textContent='삭제';


      del.onclick=e=>{

        e.stopPropagation();


        if(
          !confirm(
            '이 대화를 삭제할까요?'
          )
        ){

          return;

        }


        conversations=
          conversations.filter(
            x=>x.id!==c.id
          );


        if(
          currentId===c.id
        ){

          currentId=
            conversations[0]?.id||
            null;

        }


        if(
          !conversations.length
        ){

          createConversation(
            false
          );

        }


        saveStore();

        renderConversations();

        updateTitle();

        draw();

      };


      actions.appendChild(
        del
      );


      row.appendChild(
        main
      );

      row.appendChild(
        actions
      );


      row.onclick=()=>{

        currentId=c.id;

        const cc=current();

        document.querySelector(
          '#model'
        ).value=
          cc?.model||
          'gpt-5.6';


        images=[];

        fileAttachments=[];

        renderFiles();

        renderConversations();

        updateTitle();

        draw();

        closeDrawer();

      };


      list.appendChild(
        row
      );

    });

}


function draw(){

  chat.innerHTML='';


  const c=current();


  if(!c||!c.history.length){

    chat.innerHTML=`

      <div class="empty">

        👨‍👩‍👧 가족 GPT<br>

        질문을 입력하거나<br>

        📎 파일을 첨부하세요.

      </div>

    `;

    return;

  }


  c.history.forEach(
    m=>{

      if(m.role==='system'){

        return;

      }


      addMsg(

        m.role,

        m.content,

        m.images||[],

        m.files||
        m.generatedFiles||
        []

      );

    }
  );


  chat.scrollTop=
    chat.scrollHeight;

}


async function dataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const r=
        new FileReader();


      r.onload=()=>
        resolve(
          r.result
        );


      r.onerror=
        reject;


      r.readAsDataURL(
        file
      );

    }
  );

}

/*
 * 코드블록 복사 버튼
 */
async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    return true;

  }catch(e){

    /* 구형 브라우저/비보안 환경 대체 방식 */
    const ta=document.createElement('textarea');

    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';

    document.body.appendChild(ta);

    ta.focus();
    ta.select();

    let ok=false;

    try{
      ok=document.execCommand('copy');
    }catch(err){}

    ta.remove();

    return ok;

  }

}

function addCopyButtons(root){

  root.querySelectorAll('pre').forEach(pre=>{

    if(pre.parentElement&&pre.parentElement.classList.contains('codeWrap')){
      return;
    }

    const codeEl=pre.querySelector('code');

    const lang=(
      (codeEl&&codeEl.className.match(/language-([\w-]+)/))||[]
    )[1]||'code';

    const wrap=document.createElement('div');
    wrap.className='codeWrap';

    const head=document.createElement('div');
    head.className='codeHead';

    const label=document.createElement('span');
    label.textContent=lang;

    const btn=document.createElement('button');
    btn.className='copyBtn';
    btn.type='button';
    btn.textContent='📋 복사';

    btn.onclick=async()=>{

      const ok=await copyText(
        (codeEl||pre).innerText.replace(/\n$/,'')
      );

      btn.textContent=ok?'✅ 복사됨':'⚠️ 복사 실패';
      btn.classList.toggle('done',ok);

      setTimeout(()=>{
        btn.textContent='📋 복사';
        btn.classList.remove('done');
      },1500);

    };

    head.appendChild(label);
    head.appendChild(btn);

    pre.parentNode.insertBefore(wrap,pre);

    wrap.appendChild(head);
    wrap.appendChild(pre);

  });

}


/*
 * 코드블록 다운로드
 */
function getCodeDownloads(text){

  const out=[];


  const re=
    /```([a-zA-Z0-9_-]*)\s*\n([\s\S]*?)```/g;


  let m;


  while(
    (m=re.exec(
      String(text||'')
    ))
  ){

    out.push({

      lang:
        (m[1]||'text')
          .toLowerCase(),

      code:m[2]

    });

  }


  return out;

}


function downloadCode(
  code,
  lang,
  index=0
){

  const extMap={

    html:'html',
    htm:'html',
    javascript:'js',
    js:'js',
    css:'css',
    json:'json',
    xml:'xml',
    svg:'svg',
    markdown:'md',
    md:'md',
    csv:'csv',
    text:'txt',
    txt:'txt'

  };


  const ext=
    extMap[
      String(
        lang||'text'
      ).toLowerCase()
    ]||
    'txt';


  let filename;


  if(ext==='html'){

    filename=
      index===0
        ?'index.html'
        :`index-${index+1}.html`;

  }else{

    filename=
      `code-${index+1}.${ext}`;

  }


  const blob=
    new Blob(
      [code],
      {
        type:
          ext==='html'
            ?'text/html;charset=utf-8'
            :'text/plain;charset=utf-8'
      }
    );


  const url=
    URL.createObjectURL(
      blob
    );


  const a=
    document.createElement(
      'a'
    );


  a.href=url;

  a.download=filename;

  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(url);
    },
    1000
  );

}


/*
 * =========================================================
 * 수정된 addMsg()
 * =========================================================
 *
 * 네 번째 인자 files를 추가하여
 * 서버에서 생성한 실제 파일도 메시지에 붙입니다.
 */
function addMsg(
  role,
  text,
  imgs=[],
  files=[]
){

  const d=
    document.createElement(
      'div'
    );


  d.className=
    'msg '+role;


  let html='';


  /*
   * 이미지 표시
   */
  if(imgs.length){

    html+=
      imgs.map(
        x=>`<img src="${x}">`
      ).join('');

  }


  /*
   * 메시지 본문
   */
  html+=
    role==='assistant'
      ?markdownWithMath(text)
      :esc(text)
        .replace(
          /\n/g,
          '<br>'
        );


  d.innerHTML=
    html;

  if(role==='assistant'){
    addCopyButtons(d);
  }


  chat.appendChild(
    d
  );


  if(
    role==='assistant'
  ){

    /*
     * =====================================================
     * 기존 코드블록 다운로드
     * =====================================================
     */
    const codes=
      getCodeDownloads(
        text
      );


    if(codes.length){

      const area=
        document.createElement(
          'div'
        );


      area.className=
        'downloadArea';


      codes.forEach(
        (item,i)=>{

          const b=
            document.createElement(
              'button'
            );


          b.className=
            'downloadBtn';


          b.textContent=
            codes.length===1
              ?'⬇️ 수정 파일 다운로드'
              :`⬇️ 코드 ${i+1} 다운로드`;


          b.onclick=()=>{

            downloadCode(
              item.code,
              item.lang,
              i
            );

          };


          area.appendChild(
            b
          );

        }
      );


      d.appendChild(
        area
      );

    }


    /*
     * =====================================================
     * 서버에서 생성한 실제 파일
     * =====================================================
     */
    if(
      Array.isArray(files) &&
      files.length
    ){

      const fileArea=
        document.createElement(
          'div'
        );


      fileArea.className=
        'downloadArea';


      files.forEach(
        file=>{

          if(!file){

            return;

          }


          const b=
            document.createElement(
              'button'
            );


          b.className=
            'downloadBtn';


          b.textContent=
            `${file.icon||'📄'} `+
            `${file.name||'파일'} `+
            `⬇️ 다운로드`;


          b.onclick=()=>{

            try{

              /*
               * PDF / 이미지 등
               * dataUrl 또는 url
               */
              let url=
                file.url||
                file.dataUrl;


              /*
               * HTML / JS / CSS / JSON /
               * CSV / MD / TXT 등
               */
              if(
                !url &&
                typeof file.content===
                  'string'
              ){

                const blob=
                  new Blob(
                    [file.content],
                    {
                      type:
                        file.type||
                        'text/plain;charset=utf-8'
                    }
                  );


                url=
                  URL.createObjectURL(
                    blob
                  );

              }


              if(!url){

                alert(
                  '다운로드할 파일 데이터가 없습니다.'
                );

                return;

              }


              const a=
                document.createElement(
                  'a'
                );


              a.href=
                url;


              a.download=
                file.name||
                'download';


              document.body.appendChild(
                a
              );


              a.click();


              a.remove();


              /*
               * Blob URL만 해제
               */
              if(
                url.startsWith(
                  'blob:'
                )
              ){

                setTimeout(
                  ()=>{
                    URL.revokeObjectURL(
                      url
                    );
                  },
                  1000
                );

              }

            }catch(error){

              console.error(
                '파일 다운로드 오류:',
                error
              );


              alert(
                '파일 다운로드 중 오류가 발생했습니다.'
              );

            }

          };


          fileArea.appendChild(
            b
          );

        }
      );


      d.appendChild(
        fileArea
      );

    }


    /*
     * MathJax
     */
    if(
      window.MathJax &&
      MathJax.typesetPromise
    ){

      MathJax
        .typesetPromise([d])
        .catch(
          error=>{

            console.error(
              'MathJax 수식 렌더링 오류:',
              error
            );

          }
        );

    }

  }

}


/* =========================================================
 * 실시간 답변 (스트리밍)
 * ========================================================= */

/* 작성 중 코드펜스가 열려 있으면 임시로 닫아서 표시 */
function streamingHtml(text){

  let t=String(text||'');

  if(((t.match(/```/g)||[]).length)%2===1){
    t+='\n```';
  }

  return markdownWithMath(t);

}

/* 서버가 JSON이 아닌 글자(오류 페이지 등)를 보내도 원인을 보여줌 */
async function readJsonSafe(r){

  const t=await r.text();

  try{

    return JSON.parse(t);

  }catch(e){

    throw Error(
      '서버 응답 오류('+r.status+'): '+t.slice(0,100)
    );

  }

}

async function readChatStream(r,ph){

  const reader=r.body.getReader();
  const dec=new TextDecoder();

  let buf='';
  let acc='';
  let final=null;
  let pending=false;

  const paint=()=>{

    pending=false;

    if(!ph.isConnected){
      return;
    }

    const near=
      chat.scrollHeight-chat.scrollTop-chat.clientHeight<120;

    ph.innerHTML=streamingHtml(acc);

    if(near){
      chat.scrollTop=chat.scrollHeight;
    }

  };

  const handle=ev=>{

    if(ev.type==='delta'){

      acc+=ev.text||'';

      if(!pending){
        pending=true;
        requestAnimationFrame(paint);
      }

    }else if(ev.type==='status'){

      if(!acc&&ph.isConnected){
        ph.textContent=ev.text;
      }

    }else if(ev.type==='done'){

      final=ev;

    }else if(ev.type==='error'){

      throw Error(ev.error||'서버 오류');

    }

  };

  const parseLine=line=>{

    line=line.trim();

    if(!line){
      return;
    }

    let ev;

    try{
      ev=JSON.parse(line);
    }catch(e){
      return;
    }

    handle(ev);

  };

  while(true){

    const {done,value}=await reader.read();

    if(done){
      break;
    }

    buf+=dec.decode(value,{stream:true});

    let i;

    while((i=buf.indexOf('\n'))>=0){

      const line=buf.slice(0,i);

      buf=buf.slice(i+1);

      parseLine(line);

    }

  }

  parseLine(buf);

  if(final){
    return {answer:final.answer,files:final.files||[]};
  }

  if(acc){
    return {answer:acc,files:[]};
  }

  throw Error('응답이 중간에 끊겼습니다. 다시 시도해 주세요.');

}


async function send(){

  const text=
    q.value.trim();


  if(
    !text &&
    !images.length &&
    !fileAttachments.length
  ){

    return;

  }


  if(imageMode && !text){

    alert('만들 이미지를 글로 설명해 주세요.');

    return;

  }

  const c=
    current();


  if(!c){

    return;

  }


  const imgs=
    [...images];


  const files=
    [...fileAttachments];


  q.value='';

  autoResize();
  q.style.height='auto';

  images=[];

  fileAttachments=[];


  renderFiles();


  /* 이미지 생성은 1회성: 보낸 뒤 버튼 자동 해제 */
  const wantImage=imageMode;

  setImageMode(false);

  const userText=
    text||
    '첨부한 자료를 분석해 주세요.';


  /*
   * 저장용 기록에는 PDF 원본(base64)을 넣지 않고 안내 문구만 남깁니다.
   * (localStorage 용량과 요청 용량 보호)
   */
  const storedFiles=files.map(f=>
    f.pdf
      ?{name:f.name,content:'[PDF 첨부: '+f.name+' — 이전 질문에서 분석한 문서입니다]'}
      :f
  );

  c.history.push({

    role:'user',

    content:userText,

    images:imgs,

    files:storedFiles

  });


  if(
    c.title==='새 대화'
  ){

    c.title=
      makeTitle(
        userText
      );

  }


  c.updatedAt=
    now();


  c.model=
    document.querySelector(
      '#model'
    ).value;


  saveStore();

  renderConversations();

  updateTitle();

  draw();


  const typing={

    role:'assistant',

    content:
      '답변을 준비하고 있습니다…'

  };


  addMsg(
    'assistant',
    typing.content
  );

  const ph=chat.lastElementChild;


  try{

    const r=
      await apiFetch('/api/chat',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              model:c.model,

              question:userText,

              stream:true,

              imageMode:wantImage,

              history:
                c.history
                  .slice(0,-1)
                  .slice(-8)
                  .map((m,i,arr)=>{
                    if(m.role!=='user'){
                      return {role:m.role,content:m.content,images:[],files:[]};
                    }
                    /* 0 = 직전 질문 */
                    const rank=arr.slice(i+1).filter(x=>x.role==='user').length;
                    const keepImg=rank<1;  // 사진/PDF: 직전 1턴
                    const keepTxt=rank<3;  // 코드/텍스트: 최근 3턴
                    return {
                      role:m.role,
                      content:m.content,
                      images:keepImg?(m.images||[]):[],
                      imageCount:(m.images||[]).length,
                      files:(m.files||[]).map(f=>
                        f.pdf?(keepImg?f:{name:f.name})
                        :(keepTxt?f:{name:f.name})
                      )
                    };
                  }),

              images:imgs,

              files

            })

        }
      );


    let data;

    const ctype=
      r.headers.get('content-type')||'';

    if(r.ok&&ctype.includes('ndjson')){

      /* 일반 대화: 글자가 오는 대로 표시 */
      data=await readChatStream(r,ph);

    }else{

      /* 파일 생성 등: 완성 후 한 번에 응답 */
      data=await readJsonSafe(r);

      if(!r.ok){

        throw Error(
          data.error||
          '서버 오류'
        );

      }

    }


    if(ph.isConnected){
      ph.remove();
    }


    /*
     * 서버에서 생성된 파일까지
     * 대화 기록에 저장합니다.
     */
    c.history.push({

      role:'assistant',

      content:
        data.answer,

      files:
        Array.isArray(
          data.files
        )
          ?data.files
          :[]

    });


    c.updatedAt=
      now();


    saveStore();

    renderConversations();


    /*
     * 현재 화면에도 즉시 표시
     */
    if(currentId===c.id)addMsg(

      'assistant',

      data.answer,

      [],

      Array.isArray(
        data.files
      )
        ?data.files
        :[]

    );


    chat.scrollTop=
      chat.scrollHeight;


  }catch(e){

    if(ph.isConnected){
      ph.remove();
    }


    if(currentId===c.id)addMsg(
      'assistant',
      '⚠️ '+e.message
    );

  }

}

/* =========================================================
 * 문서 첨부 변환 (PDF / Word / Excel)
 * ========================================================= */

const PDF_MAX_BYTES=2.5*1024*1024;   // 요청 용량(4.5MB) 보호
const OFFICE_MAX_BYTES=8*1024*1024;
const MAX_TEXT_CHARS=60000;          // 모델에 보낼 변환 텍스트 상한
const MAX_SHEET_ROWS=500;

function limitText(t,label){

  t=String(t||'');

  if(t.length<=MAX_TEXT_CHARS){
    return t;
  }

  return t.slice(0,MAX_TEXT_CHARS)+
    '\n\n[... '+label+' 내용이 길어 일부만 전달되었습니다 ...]';

}

/* Word HTML → 읽기 쉬운 텍스트 (표는 | 구분) */
function wordHtmlToText(html){

  const doc=new DOMParser().parseFromString(html,'text/html');

  doc.querySelectorAll('table').forEach(t=>{

    const rows=[...t.querySelectorAll('tr')].map(tr=>
      '| '+[...tr.children].map(c=>
        c.textContent.replace(/\s+/g,' ').trim()
      ).join(' | ')+' |'
    );

    t.replaceWith(doc.createTextNode('\n'+rows.join('\n')+'\n'));

  });

  doc.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{
    const n=Number(h.tagName[1]);
    h.replaceWith(doc.createTextNode(
      '\n'+'#'.repeat(n)+' '+h.textContent.trim()+'\n'
    ));
  });

  doc.querySelectorAll('li').forEach(li=>{
    li.replaceWith(doc.createTextNode('\n- '+li.textContent.trim()));
  });

  doc.querySelectorAll('p,br').forEach(p=>{
    p.after(doc.createTextNode('\n'));
  });

  return doc.body.textContent.replace(/\n{3,}/g,'\n\n').trim();

}

async function readAttachment(f){

  const name=f.name;
  const ext=(name.split('.').pop()||'').toLowerCase();

  /* PDF: 모델이 직접 읽도록 base64로 전달 */
  if(ext==='pdf'){

    if(f.size>PDF_MAX_BYTES){
      throw Error(
        'PDF는 '+(PDF_MAX_BYTES/1024/1024).toFixed(1)+
        'MB 이하만 첨부할 수 있습니다.'
      );
    }

    const total=fileAttachments
      .filter(x=>x.pdf)
      .reduce((n,x)=>n+x.pdf.length,0);

    if((total+f.size*1.4)>3.6*1024*1024){
      throw Error('PDF 첨부 총 용량이 너무 큽니다. 하나씩 보내 주세요.');
    }

    return {name,pdf:await dataURL(f)};

  }

  /* Word (.docx) */
  if(ext==='docx'){

    if(!window.mammoth){
      throw Error('Word 변환 라이브러리를 불러오지 못했습니다.');
    }

    if(f.size>OFFICE_MAX_BYTES){
      throw Error('Word 파일은 8MB 이하만 가능합니다.');
    }

    const r=await mammoth.convertToHtml({
      arrayBuffer:await f.arrayBuffer()
    });

    const text=wordHtmlToText(r.value);

    if(!text){
      throw Error('문서에서 읽을 수 있는 텍스트가 없습니다.');
    }

    return {name,content:limitText(text,'Word 문서')};

  }

  /* Excel (.xlsx / .xls) */
  if(ext==='xlsx'||ext==='xls'){

    if(!window.XLSX){
      throw Error('Excel 변환 라이브러리를 불러오지 못했습니다.');
    }

    if(f.size>OFFICE_MAX_BYTES){
      throw Error('Excel 파일은 8MB 이하만 가능합니다.');
    }

    const wb=XLSX.read(
      await f.arrayBuffer(),
      {type:'array'}
    );

    const parts=wb.SheetNames.map(sn=>{

      const csv=XLSX.utils.sheet_to_csv(
        wb.Sheets[sn],
        {blankrows:false}
      );

      const lines=csv.split('\n');

      const cut=lines.length>MAX_SHEET_ROWS;

      return '### 시트: '+sn+
        ' (총 '+lines.length+'행)\n'+
        lines.slice(0,MAX_SHEET_ROWS).join('\n')+
        (cut?'\n[... '+MAX_SHEET_ROWS+'행까지만 전달됨 ...]':'');

    });

    return {
      name,
      content:limitText(parts.join('\n\n'),'Excel')
    };

  }

  /* 구형 형식 안내 */
  if(['doc','ppt','pptx'].includes(ext)){
    throw Error(
      '.'+ext+' 형식은 지원하지 않습니다. '+
      '.docx 또는 PDF로 저장해서 첨부해 주세요.'
    );
  }

  /* 일반 텍스트/코드 파일 */
  if(f.size>1024*1024){
    throw Error('텍스트/코드 파일은 1MB 이하만 가능합니다.');
  }

  return {name,content:await f.text()};

}

/* =========================================================
   로그인
   ========================================================= */
const TOKEN_KEY='familygpt_token';

function getToken(){try{return localStorage.getItem(TOKEN_KEY)||''}catch{return ''}}
function setToken(t){try{localStorage.setItem(TOKEN_KEY,t)}catch{}}
function clearToken(){try{localStorage.removeItem(TOKEN_KEY)}catch{}}

let loginWaiters=[];

function showLogin(){
  return new Promise(resolve=>{
    loginWaiters.push(resolve);
    document.querySelector('#loginOverlay').style.display='flex';
    setTimeout(()=>document.querySelector('#loginPw').focus(),50);
  });
}

async function submitLogin(){
  const pw=document.querySelector('#loginPw');
  const err=document.querySelector('#loginErr');
  const btn=document.querySelector('#loginBtn');
  err.textContent='';
  if(!pw.value){err.textContent='비밀번호를 입력해 주세요.';return}
  btn.disabled=true;
  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pw.value})
    });
    const x=await r.json().catch(()=>({}));
    if(!r.ok||!x.token){
      err.textContent=x.error||'로그인에 실패했습니다.';
      return;
    }
    setToken(x.token);
    pw.value='';
    document.querySelector('#loginOverlay').style.display='none';
    loginWaiters.splice(0).forEach(f=>f());
  }catch{
    err.textContent='서버에 연결할 수 없습니다.';
  }finally{
    btn.disabled=false;
  }
}

/* 모든 /api 호출은 이 함수를 사용 (토큰 자동 첨부, 401이면 로그인창) */
async function apiFetch(url,opts={}){
  const headers=new Headers(opts.headers||{});
  const t=getToken();
  if(t)headers.set('Authorization','Bearer '+t);
  const r=await fetch(url,{...opts,headers});
  if(r.status===401){
    clearToken();
    showLogin().then(()=>{try{loadFiles()}catch{}});
  }
  return r;
}

async function ensureLogin(){
  if(!getToken())return showLogin();
  try{
    const r=await fetch('/api/login',{
      headers:{Authorization:'Bearer '+getToken()}
    });
    if(r.status===401){clearToken();return showLogin()}
  }catch{}
}
