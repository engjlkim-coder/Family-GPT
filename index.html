<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#314d68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가족 GPT">
<link rel="manifest" href="./manifest.json">
<title>가족 GPT</title>
<style>
:root{--navy:#314d68;--navy2:#45647f;--bg:#eef2f5;--line:#c8d0d7}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg)}
body{display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
h1{font-size:19px;margin:0}.sub{font-size:11px;opacity:.8;margin-top:2px}
#tools{background:#fff;padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;white-space:nowrap}
button,select{border:1px solid #b8c2cb;border-radius:8px;background:#fff;padding:8px 10px;font-size:13px}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
#chat{flex:1;overflow:auto;padding:10px 9px 8px}
.msg{max-width:91%;padding:10px 11px;margin:7px 0;border-radius:12px;line-height:1.5;font-size:15px;word-break:break-word}
.user{margin-left:auto;background:#d8ebe2}.assistant{background:#fff;border:1px solid #d7dde2}
.msg img{max-width:100%;max-height:280px;border-radius:9px;margin-top:5px}
#files{background:#fff;border-top:1px solid var(--line);padding:7px 10px;display:none}
.file{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #eee}
#attach{background:#edf2f5;border-top:1px solid var(--line);padding:6px 9px;display:none;gap:6px;overflow-x:auto}
.thumb{position:relative;flex:none}.thumb img{width:55px;height:55px;object-fit:cover;border-radius:8px}.thumb button{position:absolute;right:-4px;top:-4px;padding:1px 5px;border-radius:50%;font-size:11px}
#composer{background:#fff;border-top:1px solid var(--line);padding:8px;display:flex;gap:6px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#question{flex:1;border:1px solid #b8c2cb;border-radius:10px;padding:10px;font-size:15px;outline:none;min-width:0}
.iconbtn{font-size:19px;padding:7px 9px}.send{min-width:52px}
small{color:#68737c}
pre{background:#272822;color:#f8f8f2;padding:9px;overflow:auto;border-radius:7px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}
#panel{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:15px;max-height:80vh;overflow:auto}
</style>
<script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<header><div><h1>👨‍👩‍👧 가족 GPT</h1><div class="sub">개인용 AI · 파일/이미지 검색</div></div><button id="install" style="display:none">📲 설치</button></header>
<div id="tools">
<select id="model"><option value="gpt-5.6">GPT-5.6</option><option value="gpt-5-mini">GPT-5-mini</option><option value="gpt-4o">GPT-4o</option></select>
<button id="camera">📷 사진</button>
<button id="gallery">🖼️ 이미지</button>
<button id="docs">📚 지식파일</button>
<button id="backup">💾 백업</button>
<button id="clear">🗑️ 초기화</button>
<input id="imgInput" type="file" accept="image/*" capture="environment" multiple hidden>
<input id="docInput" type="file" accept=".pdf,.txt,.md,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv" multiple hidden>
</div>
<div id="files"></div>
<div id="chat"></div>
<div id="attach"></div>
<div id="composer">
<button class="iconbtn" id="clip">📎</button>
<input id="question" placeholder="질문을 입력하세요..." autocomplete="off">
<button class="primary send" id="send">전송</button>
</div>

<div id="modal"><div id="panel"><b>💾 대화 백업</b><p><button id="saveJson">JSON 저장</button> <button id="loadJson">JSON 불러오기</button></p><p><small>대화는 이 휴대폰의 브라우저 저장공간에도 자동 저장됩니다.</small></p><button id="close">닫기</button><input id="jsonInput" type="file" accept=".json" hidden></div></div>

<script>
const converter=new showdown.Converter({tables:true});
const chat=document.querySelector("#chat"), q=document.querySelector("#question");
let history=JSON.parse(localStorage.getItem("familyGPTHistory")||"[]");
let images=[]; let deferredPrompt=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(){
 chat.innerHTML="";
 history.forEach(m=>{if(m.role==="system")return; addMsg(m.role,m.content,m.images||[])});
 chat.scrollTop=chat.scrollHeight;
}
function addMsg(role,text,imgs=[]){
 const d=document.createElement("div");d.className="msg "+role;
 let html=role==="user"?"<b>🙋‍♂️ 나</b><br>":"<b>🤖 GPT</b><br>";
 if(imgs.length) html+=imgs.map(x=>`<img src="${x}">`).join("");
 html+=role==="assistant"?converter.makeHtml(text):esc(text).replace(/\n/g,"<br>");
 d.innerHTML=html;chat.appendChild(d);
 if(role==="assistant")MathJax.typesetPromise([d]).catch(()=>{});
}
function save(){localStorage.setItem("familyGPTHistory",JSON.stringify(history.slice(-80)))}
function renderAttach(){
 const a=document.querySelector("#attach");a.innerHTML="";
 if(!images.length){a.style.display="none";return} a.style.display="flex";
 images.forEach((src,i)=>{const d=document.createElement("div");d.className="thumb";d.innerHTML=`<img src="${src}"><button>×</button>`;d.querySelector("button").onclick=()=>{images.splice(i,1);renderAttach()};a.appendChild(d)})
}
function dataURL(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}

async function send(){
 const text=q.value.trim(); if(!text&&!images.length)return;
 const imgs=[...images]; q.value="";images=[];renderAttach();
 history.push({role:"user",content:text||"첨부한 이미지를 분석해 주세요.",images:imgs});addMsg("user",text||"첨부한 이미지를 분석해 주세요.",imgs);save();
 const typing={role:"assistant",content:"답변을 준비하고 있습니다…"};addMsg("assistant",typing.content);
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:document.querySelector("#model").value,question:text||"첨부 이미지를 분석해 주세요.",history:history.slice(-12),images:imgs})});
  const data=await r.json(); if(!r.ok)throw Error(data.error||"서버 오류");
  chat.lastElementChild.remove();history.push({role:"assistant",content:data.answer});addMsg("assistant",data.answer);save();
 }catch(e){chat.lastElementChild.remove();addMsg("assistant","⚠️ "+e.message)}
}
document.querySelector("#send").onclick=send;
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
document.querySelector("#camera").onclick=()=>{document.querySelector("#imgInput").setAttribute("capture","environment");document.querySelector("#imgInput").click()};
document.querySelector("#gallery").onclick=()=>{document.querySelector("#imgInput").removeAttribute("capture");document.querySelector("#imgInput").click()};
document.querySelector("#clip").onclick=()=>document.querySelector("#imgInput").click();
document.querySelector("#imgInput").onchange=async e=>{for(const f of e.target.files){if(f.size<=10*1024*1024)images.push(await dataURL(f))}e.target.value="";renderAttach()};

document.querySelector("#docs").onclick=()=>document.querySelector("#docInput").click();
document.querySelector("#docInput").onchange=async e=>{
 for(const f of e.target.files){
  const fd=new FormData();fd.append("file",f);
  try{const r=await fetch("/api/knowledge/upload",{method:"POST",body:fd});const x=await r.json();if(!r.ok)throw Error(x.error);alert(f.name+" 등록 완료")}
  catch(err){alert(f.name+" : "+err.message)}
 }
 e.target.value="";loadFiles()
};
async function loadFiles(){
 try{const r=await fetch("/api/knowledge");const x=await r.json();const box=document.querySelector("#files");
 if(!x.files?.length){box.style.display="none";return}box.style.display="block";box.innerHTML="<b>📚 등록된 지식자료</b>";
 x.files.forEach(f=>{const d=document.createElement("div");d.className="file";d.innerHTML=`<span>📄 ${esc(f.filename)}</span><button>삭제</button>`;d.querySelector("button").onclick=async()=>{await fetch("/api/knowledge/"+encodeURIComponent(f.id),{method:"DELETE"});loadFiles()};box.appendChild(d)})
 }catch{}
}
document.querySelector("#clear").onclick=()=>{if(confirm("대화를 모두 지울까요?")){history=[];save();draw()}};
const modal=document.querySelector("#modal");document.querySelector("#backup").onclick=()=>modal.style.display="flex";document.querySelector("#close").onclick=()=>modal.style.display="none";
document.querySelector("#saveJson").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(history,null,2)],{type:"application/json"}));a.download="family-gpt-chat.json";a.click()};
document.querySelector("#loadJson").onclick=()=>document.querySelector("#jsonInput").click();
document.querySelector("#jsonInput").onchange=e=>{const r=new FileReader;r.onload=()=>{try{history=JSON.parse(r.result);save();draw();modal.style.display="none"}catch{alert("올바른 JSON 파일이 아닙니다.")}};r.readAsText(e.target.files[0])};

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.querySelector("#install").style.display="block"});
document.querySelector("#install").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
draw();loadFiles();
</script>
</body></html>
